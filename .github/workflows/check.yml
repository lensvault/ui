name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pip install actionlint-py==1.7.12.25 && actionlint
      - run: pnpm check
      - name: Check the committed build matches the source
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git status --short -- dist
            echo "dist/ is out of date: run pnpm bundle and commit it."
            exit 1
          fi

  release-tag:
    name: Tag the release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag and release the version in package.json if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged."
            exit 0
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes
